<!DOCTYPE html>
<html>

<head>
    <title>ASP CRM Login</title>
</head>

<body>

    <h1>ASP CRM</h1>

    <h2>Login</h2>

    {% if form.errors %}

        <p>Incorrect username or password.</p>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'signup' %}">
            Create Account
        </a>
    </p>

</body>

</html>
