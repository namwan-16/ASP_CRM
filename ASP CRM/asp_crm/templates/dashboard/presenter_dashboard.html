<!DOCTYPE html>

<html>

<head>

    <title>Presenter Dashboard</title>

</head>

<body>

    <h1>ASP CRM</h1>

    <h2>Presenter Dashboard</h2>

    <p>
        Welcome {{ user.username }}
    </p>

    <h3>My Classes</h3>

    <ul>

        <li>View Classes</li>

        <li>View Students</li>

        <li>Take Attendance</li>

        <button type="submit">
            Logout
        </button>

    </form>

</body>

</html>
