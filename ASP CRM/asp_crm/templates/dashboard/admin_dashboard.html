<!DOCTYPE html>

<html>

<head>

    <title>ASP CRM - Admin Dashboard</title>

</head>

<body>

    <h1>ASP CRM</h1>

    <h2>Admin Dashboard</h2>

    <p>
        Welcome {{ user.username }}
    </p>

    <hr>

    <h3>Management</h3>

    <ul>

        <li>Students</li>

        <li>Guardians</li>

        <li>Presenters</li>

        <li>Classes</li>

        <li>Attendance</li>

        <li>Progress Notes</li>

        <li>Payments</li>

        <li>Refunds</li>

        <li>Reports</li>

        <li>User Management</li>

    </ul>

    <form method="POST" action="{% url 'logout' %}">

        {% csrf_token %}

        <button type="submit">
            Logout
        </button>

    </form>

</body>

</html>
